services:
  frontend:
    build: ./front-end
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    environment:
      PORT: "8080"
    depends_on:
      user-service:
        condition: service_healthy
      listing-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  user-service:
    build: ./user-service
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://marketday:marketday@users-db:5432/users"
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-before-deploying}"
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: marketday
      POSTGRES_PASSWORD: marketday
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketday -d users"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  listing-service:
    build: ./listing-service
    environment:
      PORT: "3002"
      MONGODB_URL: "mongodb://listings-db:27017"
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-before-deploying}"
    depends_on:
      listings-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  listings-db:
    image: mongo:7
    volumes:
      - listings-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  messaging-service:
    build: ./messaging-service
    environment:
      PORT: "3003"
      DATABASE_URL: "postgres://marketday:marketday@messages-db:5432/messages"
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-before-deploying}"
    depends_on:
      messages-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  messages-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messages
      POSTGRES_USER: marketday
      POSTGRES_PASSWORD: marketday
    volumes:
      - messages-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketday -d messages"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  users-data:
  listings-data:
  messages-data:
