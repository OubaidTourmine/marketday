services:
  frontend:
    build: ./front-end
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:80"]
    depends_on:
      api-gateway: {condition: service_healthy}
    restart: unless-stopped
  api-gateway:
    build: {context: ., dockerfile: api-gateway/Dockerfile}
    environment:
      PORT: "8080"
      USER_SERVICE_URL: http://user-service:3001
      LISTING_SERVICE_URL: http://listing-service:3002
      MESSAGING_SERVICE_URL: http://messaging-service:3003
    depends_on:
      user-service: {condition: service_healthy}
      listing-service: {condition: service_healthy}
      messaging-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  user-service:
    build: {context: ., dockerfile: user-service/Dockerfile}
    environment:
      PORT: "3001"
      DATA_FILE: /data/users.sqlite
      USER_SERVICE_URL: http://user-service:3001
      LISTING_SERVICE_URL: http://listing-service:3002
      SEED_DEMO: "${SEED_DEMO:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes: ["users-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  listing-service:
    build: {context: ., dockerfile: listing-service/Dockerfile}
    environment:
      PORT: "3002"
      DATA_FILE: /data/listings.sqlite
      USER_SERVICE_URL: http://user-service:3001
      LISTING_SERVICE_URL: http://listing-service:3002
      SEED_DEMO: "${SEED_DEMO:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes: ["listings-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  messaging-service:
    build: {context: ., dockerfile: messaging-service/Dockerfile}
    environment:
      PORT: "3003"
      DATA_FILE: /data/messages.sqlite
      USER_SERVICE_URL: http://user-service:3001
      LISTING_SERVICE_URL: http://listing-service:3002
      SEED_DEMO: "${SEED_DEMO:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes: ["messages-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  users-data:
  listings-data:
  messages-data:
